<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiaPhy connecting to device</title>

    <link rel="icon" type="image/png" href="/fiaphy/javascript/9835729.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            min-height: 100%;
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            background: #ffffff;
            color: #000000;
        }

        .loading-screen {
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            text-align: center;
        }

        .loading-logo {
            display: none;
        }

        .loading-message {
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: normal;
            text-align: center;
            max-width: 32rem;
            margin: 0 auto;
            line-height: 1.4;
        }

        .connect-gif {
            display: block;
            width: min(70vw, 260px);
            height: auto;
            max-width: 100%;
            margin: 0 auto 1rem;
        }

        .spinner {
            width: auto;
            height: auto;
            margin: 0 auto 1rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .spinner::before {
            content: "Redirecting to device page...";
            display: block;
        }

        .spinner svg,
        .circular {
            display: none;
        }

        @media (max-width: 480px) {
            .loading-screen {
                justify-content: flex-start;
                padding-top: 3rem;
            }

            .connect-gif {
                width: min(82vw, 220px);
            }

            .loading-message {
                font-size: 13px;
                text-align: left;
                max-width: 20rem;
            }
        }
    </style>
    <script>
        // // Redirect after 2 seconds
        // setTimeout(function() {
        //     window.location.href = 'http://192.168.4.1';
        // }, 2000);
    </script>
</head>
<body>
    <div class="loading-screen">
        <img class="connect-gif" src="/fiaphy/javascript/9835729.png" loading="eager" decoding="async" referrerpolicy="no-referrer" alt="">
        <p class="loading-message">If the device page does not open automatically, go to FiaPhy Internal Server address: http://192.168.4.1.</p>
    </div>
</body>
</html>
