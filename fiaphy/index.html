<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiaPhy connecting to device</title>
    <meta http-equiv="refresh" content="2;url=http://192.168.4.1">
    <link rel="icon" type="image/png" href="/fiaphy/javascript/9835729.png">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            margin: 0;
            font-family: "Times New Roman", Times, serif;
            background: #ffffff;
            color: #000000;
        }

        .loading-screen {
            width: 100%;
            height: 100vh;
            display: block;
            padding-top: 8rem;
            text-align: center;
        }

        .loading-logo {
            display: none;
        }

        .loading-message {
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            font-weight: normal;
            text-align: center;
        }

        .spinner {
            width: auto;
            height: auto;
            margin: 0 auto 1rem;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        .spinner::before {
            content: "Redirecting to device page...";
            display: block;
        }

        .spinner svg,
        .circular {
            display: none;
        }
    </style>
    <script>
        // Redirect after 2 seconds
        setTimeout(function() {
            window.location.href = 'http://192.168.4.1';
        }, 2000);
    </script>
</head>
<body>
    <div class="loading-screen">
        <img alt="FiaPhy logo" class="loading-logo" src="https://fiaos.org/assets/media/fiaphy-clean.png" />
        <div class="spinner">
            <svg class="circular" viewBox="25 25 50 50">
                <circle class="path" cx="50" cy="50" r="20" fill="none" stroke-width="2" stroke-miterlimit="10"/>
            </svg>
        </div>
        <p class="loading-message">If the device page does not open automatically, go to http://192.168.4.1.</p>
    </div>
</body>
</html>
